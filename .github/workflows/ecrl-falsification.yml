name: ecrl-falsification

on:
  push:
    branches: [main]
    paths:
      - 'internal/recovery/**'
      - 'docs/fa/15-stage-d-ecrl.md'
      - 'docs/en/15-stage-d-ecrl.md'
      - '.github/workflows/ecrl-falsification.yml'
  workflow_dispatch:

concurrency:
  group: ecrl-falsification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Baseline F01-F10 and model gates
        run: |
          go test ./internal/recovery \
            -run '^(TestECRLF|TestECRLKReleaseNotRequiredForCurrentInMemoryResume|TestECRLFutureDurableSlowTargetReplayBoundNoDeadlock|TestECRLMutationCatalogCoversEveryF)' \
            -count=1 -v

      - name: Stage-1 real engine refinement, generated differential and atomicity gate
        run: |
          go test ./internal/recovery \
            -run '^(TestEngine|TestStage1DifferentialGenerated|TestDurableSnapshot)' \
            -count=1 -v

      - name: Mutation kill gate — original F tests must FAIL
        shell: bash
        run: |
          set -euo pipefail

          kill_mutant() {
            local mutant="$1"
            local test_name="$2"
            echo "===== MUTANT ${mutant} -> ${test_name} (expected FAIL) ====="
            set +e
            output="$(ECRL_MUTANT="${mutant}" go test ./internal/recovery -run "^${test_name}$" -count=1 -v 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              echo "MUTANT_SURVIVED ${mutant}: gate OPEN"
              exit 1
            fi
            if ! grep -q -- "--- FAIL: ${test_name}" <<<"$output"; then
              echo "MUTANT_INVALID ${mutant}: expected original F test failure not visible"
              exit 1
            fi
            echo "MUTANT_KILLED ${mutant} by ${test_name}"
          }

          kill_mutant f01_accept_old_epoch TestECRLF01ZombieCarrier
          kill_mutant f02_accept_both_candidates TestECRLF02DualCandidate
          kill_mutant f03_replay_from_k TestECRLF03LostACK
          kill_mutant f04_overlap_ring_replay TestECRLF04AcceptedNotDeliveredPartition
          kill_mutant f05_accept_tombstone_open TestECRLF05TombstoneResurrection
          kill_mutant f06_lost_fin_never_closes TestECRLF06LostFIN
          kill_mutant f06_apply_fin_twice TestECRLF06DuplicateFINIdempotence
          kill_mutant f07_resume_after_boot_change TestECRLF07PeerRestart
          kill_mutant f08_accept_a_gt_s TestECRLF08InconsistentSnapshot
          kill_mutant f09_skip_k_le_a TestECRLF09DeterministicPropertySweep
          kill_mutant f10_replay_from_a_minus_1 TestECRLF10ExactByteStream
          kill_mutant f10_replay_from_a_plus_1 TestECRLF10ExactByteStream

      - name: Stage-1 engine mutation kill gate — engine F tests must FAIL
        shell: bash
        run: |
          set -euo pipefail

          kill_engine_mutant() {
            local mutant="$1"
            local test_name="$2"
            echo "===== ENGINE MUTANT ${mutant} -> ${test_name} (expected FAIL) ====="
            set +e
            output="$(ECRL_ENGINE_MUTANT="${mutant}" go test ./internal/recovery -run "^${test_name}$" -count=1 -v 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              echo "ENGINE_MUTANT_SURVIVED ${mutant}: refinement gate OPEN"
              exit 1
            fi
            if ! grep -q -- "--- FAIL: ${test_name}" <<<"$output"; then
              echo "ENGINE_MUTANT_INVALID ${mutant}: expected engine F failure not visible"
              exit 1
            fi
            echo "ENGINE_MUTANT_KILLED ${mutant} by ${test_name}"
          }

          kill_engine_mutant f01_accept_old_epoch TestEngineECRLF01ZombieCarrier
          kill_engine_mutant f02_accept_both_candidates TestEngineECRLF02DualCandidate
          kill_engine_mutant f03_replay_from_k TestEngineECRLF03LostACK
          kill_engine_mutant f07_resume_after_boot_change TestEngineECRLF07PeerRestart
          kill_engine_mutant f08_accept_a_gt_s TestEngineECRLF08InconsistentSnapshot
          kill_engine_mutant f09_skip_k_le_a TestEngineECRLF09DeterministicSnapshotSweep
          kill_engine_mutant commit_two_stage TestEngineCommitAtomicNoMixedAuthority
