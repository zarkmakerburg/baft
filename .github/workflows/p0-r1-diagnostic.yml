name: p0-r1-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/session/**'
      - 'internal/node/**'
      - 'tests/integration/recovery_runtime_test.go'
      - '.github/workflows/p0-r1-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: p0-r1-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  class-a-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Class-A normal 2500x
        run: go test ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=2500 -timeout 18m -v

  class-a-gomax2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Class-A GOMAXPROCS=2 2500x
        run: go test ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=2500 -timeout 18m -v

  class-a-cpu-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Class-A under CPU load 2000x
        shell: bash
        run: |
          set -euo pipefail
          pids=""
          for i in $(seq 1 "$(nproc)"); do
            (while :; do :; done) &
            pids="$pids $!"
          done
          trap 'kill $pids 2>/dev/null || true' EXIT
          GOMAXPROCS=2 go test ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=2000 -timeout 18m -v

  class-a-race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Class-A race 300x
        run: go test -race ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=300 -timeout 23m -v
