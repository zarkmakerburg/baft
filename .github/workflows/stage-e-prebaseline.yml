name: stage-e-prebaseline

on:
  workflow_dispatch:
  push:
    branches:
      - bench/stage-e-foundation
    paths:
      - '.github/workflows/stage-e-prebaseline.yml'

permissions:
  contents: read

concurrency:
  group: stage-e-prebaseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prebaseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Repeated throughput B06
        run: |
          go run ./cmd/baft-bench -scenario B06 -out '${{ runner.temp }}/baft-stage-e'
      - name: Repeated recovery B07
        run: |
          go run ./cmd/baft-bench -scenario B07 -out '${{ runner.temp }}/baft-stage-e'
      - name: Repeated direct TCP control B08
        run: |
          go run ./cmd/baft-bench -scenario B08 -out '${{ runner.temp }}/baft-stage-e'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baft-stage-e-prebaseline-${{ github.sha }}
          path: ${{ runner.temp }}/baft-stage-e
          if-no-files-found: error
          retention-days: 30
