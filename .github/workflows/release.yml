name: release

# Builds, signs and verifies a release when a v* tag is pushed, then opens a
# draft GitHub release for the owner to review and publish.
#
# Needs a protected `release` environment holding:
#   BAFT_RELEASE_SIGNING_KEY  release signing private key (baft-release keygen)
#   BAFT_RELEASE_KEY_CERT     root-signed certificate for that key (baft-release certify)
# and, committed by the root holder, the root public key at
# release/keys/root.pub and the current root-signed revocation list at
# release/keys/revocations.json (it must not be expired).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Check the tag and the pinned root key
        run: |
          set -euo pipefail
          if [ ! -s release/keys/root.pub ]; then
            echo "::error::release/keys/root.pub is missing; commit the offline root public key first"
            exit 1
          fi
          if [ ! -s release/keys/revocations.json ]; then
            echo "::error::release/keys/revocations.json is missing; sign an initial list with baft-release revoke"
            exit 1
          fi
          git fetch --no-tags origin main release-v1-goldapp
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release-v1-goldapp; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main or release-v1-goldapp"
            exit 1
          fi
      - name: Build
        run: scripts/release/build.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"
      - name: Sign
        env:
          BAFT_RELEASE_SIGNING_KEY: ${{ secrets.BAFT_RELEASE_SIGNING_KEY }}
          BAFT_RELEASE_KEY_CERT: ${{ secrets.BAFT_RELEASE_KEY_CERT }}
        run: |
          set -euo pipefail
          for v in BAFT_RELEASE_SIGNING_KEY BAFT_RELEASE_KEY_CERT; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing release secret::$v is empty. Add it to the 'release' environment (Settings > Environments > release > secrets) and re-run."
              exit 1
            fi
          done
          printf '%s\n' "$BAFT_RELEASE_KEY_CERT" > "$RUNNER_TEMP/release-key.cert.json"
          go run ./cmd/baft-release sign -dir "$RUNNER_TEMP/dist" \
            -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" \
            -cert "$RUNNER_TEMP/release-key.cert.json" -root-pub release/keys/root.pub \
            -build-flag -trimpath -build-flag -buildvcs=false -build-flag 'CGO_ENABLED=0' \
            -build-flag '-ldflags=-s -w -buildid='
      - name: Verify against the pinned root key
        run: |
          go run ./cmd/baft-release verify -dir "$RUNNER_TEMP/dist" -root-pub release/keys/root.pub \
            -revocations release/keys/revocations.json
      - name: Offline bundle
        run: |
          set -euo pipefail
          scripts/release/offline_bundle.sh "$RUNNER_TEMP/dist" release/keys/revocations.json install.sh "$RUNNER_TEMP/offline"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/offline/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          BAFT_REVOCATIONS_FILE=release/keys/revocations.json BAFT_VERIFY_ARTIFACTS="baft-linux-amd64 baft-pair-linux-amd64 baft-agent-linux-amd64" \
            bash install.sh --verify-release "$(echo "$RUNNER_TEMP"/unpacked/baft-offline-*)/release"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error title=Release already exists::A GitHub release for $GITHUB_REF_NAME already exists. Delete that release (keep the tag) and re-run; this workflow creates the signed draft itself."
            exit 1
          fi
          if [ -f "release/notes/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "release/notes/$GITHUB_REF_NAME.md")
          else
            notes=(--notes "Signed release. Verify with: baft-release verify -dir <download dir> -root-pub release/keys/root.pub -revocations release/keys/revocations.json")
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* "$RUNNER_TEMP"/offline/* \
            --draft --verify-tag --title "BAFT $GITHUB_REF_NAME" "${notes[@]}"
