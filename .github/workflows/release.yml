name: release

# A v* tag produces an unsigned release candidate only.
#
# SECURITY BOUNDARY:
# - GitHub Actions never receives the long-lived BAFT release signing key or
#   release-key certificate.
# - Repository-controlled code may build candidate artifacts, but it cannot
#   turn them into a trusted BAFT release.
# - Signing and publication happen only after an independent/offline signer
#   verifies the candidate tag+commit and signs with the protected key.
#
# This intentionally trades release automation for key isolation. A future
# external HSM/KMS/OIDC signer may restore automation without reintroducing
# long-lived signing authority into this repository's workflow runtime.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Check tag and release trust data
        run: |
          set -euo pipefail
          test -s release/keys/root.pub
          test -s release/keys/revocations.json
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME does not point to main history"
            exit 1
          fi
          scripts/third_party_licenses.sh --check

      - name: Build unsigned release candidate
        run: scripts/release/build.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"

      - name: Stage unsigned candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate/dist" "$RUNNER_TEMP/candidate/notices"
          cp -a "$RUNNER_TEMP/dist/." "$RUNNER_TEMP/candidate/dist/"
          cp release/keys/root.pub "$RUNNER_TEMP/candidate/root.pub"
          cp release/keys/revocations.json "$RUNNER_TEMP/candidate/revocations.json"
          cp install.sh "$RUNNER_TEMP/candidate/install.sh"
          cmp -s "$RUNNER_TEMP/candidate/install.sh" "$RUNNER_TEMP/candidate/dist/baft-install-linux-amd64"
          cmp -s "$RUNNER_TEMP/candidate/install.sh" "$RUNNER_TEMP/candidate/dist/baft-install-linux-arm64"
          cp scripts/release/offline_bundle.sh "$RUNNER_TEMP/candidate/offline_bundle.sh"
          cp LICENSE COPYRIGHT THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/candidate/notices/"
          if [ -f "release/notes/$GITHUB_REF_NAME.md" ]; then
            cp "release/notes/$GITHUB_REF_NAME.md" "$RUNNER_TEMP/candidate/notes.md"
          else
            printf '%s\n' "BAFT $GITHUB_REF_NAME candidate; sign and verify outside GitHub Actions before publication."               > "$RUNNER_TEMP/candidate/notes.md"
          fi
          cat > "$RUNNER_TEMP/candidate/CANDIDATE" <<EOF
          tag=$GITHUB_REF_NAME
          commit=$GITHUB_SHA
          signed=false
          signing_boundary=external-offline
          EOF

      - name: Assert candidate is unsigned
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/candidate/dist/manifest.json"
          test ! -e "$RUNNER_TEMP/candidate/dist/release-key.cert.json"
          test ! -e "$RUNNER_TEMP/candidate/dist/SHA256SUMS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 1

      - name: Release boundary notice
        run: |
          {
            echo "### BAFT unsigned release candidate"
            echo
            echo "Tag: `$GITHUB_REF_NAME`"
            echo "Commit: `$GITHUB_SHA`"
            echo
            echo "No signing credential was available to this workflow."
            echo "Do not publish these artifacts until an independent/offline trusted signer has signed and verified them."
          } >> "$GITHUB_STEP_SUMMARY"
