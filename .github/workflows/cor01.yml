name: cor01-1gib

on:
  push:
    branches: [main]
    paths:
      - 'tests/correctness/**'
      - 'internal/session/**'
      - 'internal/resources/**'
      - 'internal/scheduler/**'
      - 'internal/protocol/**'
      - 'internal/carrier/**'
      - '.github/workflows/cor01.yml'
  workflow_dispatch:

concurrency:
  group: cor01-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: COR-01 1 GiB bidirectional hash gate
        env:
          BAFT_COR01_1GIB: "1"
        run: go test ./tests/correctness -run '^TestCOR01OneGiBBidirectional$' -count=1 -timeout 20m -v
