name: BCC V3 UI contract tests
on:
  pull_request:
    paths:
      - 'web/bcc-*v3.js'
      - 'web/bcc-*-v3-preview.html'
      - 'docs/bcc-welcome-login-v3-50-steps.md'
      - 'docs/bcc-ui-end-to-end-150-step-audit.md'
      - 'internal/bcc/dashboard.go'
      - 'web/tests/bcc-v3-*.test.cjs'
      - '.github/workflows/bcc-v3-ui-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check web/bcc-globe-v3.js
          node --check web/bcc-live-adapter-v3.js
          node --check web/bcc-topology-snapshot-v3.js
          for test_file in web/tests/bcc-v3-*.test.cjs; do node --check "$test_file"; done
      - name: Contract tests
        run: node --test web/tests/bcc-v3-*.test.cjs
