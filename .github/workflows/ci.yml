name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, release-v1-goldapp]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Toolchain
        run: go version
      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Unit and integration tests
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Report failing tests
        # Job logs are not always retrievable; annotations are.
        if: failure()
        run: |
          grep -E -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" | head -40 |
            sed 's/%/%25/g; s/^/::error title=go test::/' || true
      - name: Step 1 stability evidence
        run: |
          go test ./tests/integration -run '^TestSixNodeNoiseMasterHandshakeRoundTrip$' -count=1 -v
          go test ./tests/integration -run '^TestNNodeNoiseMasterHandshakeRoundTrip$' -count=1 -v
          go test ./internal/recovery -run '^TestSixRouteECRLEngineHealth$' -count=1 -v
          go test ./internal/recordshape -run 'TestMorphingStatistics1000|TestStatisticalGateRejectsFixedBucketAndPeriodicMutants' -count=1 -v
      - name: Step 2 sync integrity evidence
        run: go test ./internal/clustersync -run 'TestTokenRoundTripSixNodes|TestTokenTamperRejected|TestWorkerDetectsSignedNodeUpdateAndSyncs|TestRollbackAndWrongSignerRejected|TestBuildWorkerConfigsMirrorsExactlySixRoutes|TestChangedRouteIndexesPinpointsSingleNodeUpdate' -count=1 -v
      - name: Step 3 dynamic BCC evidence
        run: |
          go test ./internal/cluster -run 'TestValidateMasterConfigsDynamicSizes|TestMasterFailFastCancelsDynamicPeerSet' -count=1 -v
          go test ./internal/clustersync -run 'TestTokenDynamicNodeCounts|TestBuildWorkerConfigsDynamicNodeCounts' -count=1 -v
          go test ./internal/bcc -run 'TestDynamicRegistryAndEnrollmentJobs|TestOneClickDeployCreatesOnlyTypedJobs|TestHealthProbeAndDashboard' -count=1 -v
      - name: N-node invariant evidence
        run: |
          go test ./tests/integration -run '^(TestNNodeNoiseMasterHandshakeRoundTrip|TestNNodeNoiseMasterHandshakeRandomizedCardinality)$' -count=1 -v
          go test ./internal/cluster -run '^TestValidateMasterConfigsDynamicSizes$' -count=1 -v
          go test ./internal/clustersync -run '^(TestTokenDynamicNodeCounts|TestBuildWorkerConfigsDynamicNodeCounts)$' -count=1 -v
          go test ./internal/bcc -run '^TestDynamicRegistryAndEnrollmentJobs$' -count=1 -v
      - name: Live identity-keyed topology reconciliation evidence
        run: |
          go test ./internal/cluster -run 'TestLiveTopologyPermutationNoRuntimeChurn|TestLiveTopologyAddOnlyStartsAddedNode|TestLiveTopologyRemoveOnlyStopsRemovedNode|TestLiveTopologyAddFailureRollsBack|TestChangedExistingNodeFailsBeforeMutation|TestSameGenerationSemanticNoOp|TestSameGenerationConflictFailsClosed|TestRollbackGenerationDoesNotTouchRuntime|TestAllowedIdentityURIReplacementIsRemoveAdd' -count=1 -v
          go test -race ./internal/cluster -run 'TestWorkerControllerConcurrentApplySerialized' -count=20 -v
          go test ./tests/integration -run 'TestLiveTopologyRemoveUnrelatedNodePreservesActiveFlow|TestLiveTopologyAddUnrelatedNodePreservesActiveFlow|TestTopologyGenerationDoesNotAdvanceUnrelatedSessionEpoch' -count=1 -timeout 15m -v
      - name: Topology x ECRL authority isolation evidence
        run: |
          go test ./tests/integration -run 'TestTopologyPrepareRecoveryCommitAuthorityIsolation|TestTopologyCommitDuringRecoveryPrepared|TestTopologyCommitDuringCommitUncertainty|TestTopologyCommitDuringFinalizationUncertainty|TestTopologyMutationDuringReplayOutstanding|TestTopologyPermutationDuringRecoveryNoChurn|TestTopologyAddUnrelatedNodeDuringRecovery|TestTopologyRemoveUnrelatedNodeDuringRecovery|TestStaleTopologyCommitCannotAffectRecovery|TestStaleRecoveryCallbackCannotAffectTopology' -count=1 -timeout 30m -v
          BAFT_AUTHORITY_RACE_SAMPLE=1 go test -race ./tests/integration -run 'TestTopologyPrepareRecoveryCommitAuthorityIsolation|TestTopologyCommitDuringRecoveryPrepared|TestTopologyCommitDuringCommitUncertainty|TestTopologyCommitDuringFinalizationUncertainty|TestTopologyMutationDuringReplayOutstanding|TestTopologyPermutationDuringRecoveryNoChurn|TestTopologyAddUnrelatedNodeDuringRecovery|TestTopologyRemoveUnrelatedNodeDuringRecovery|TestStaleTopologyCommitCannotAffectRecovery|TestStaleRecoveryCallbackCannotAffectTopology' -count=20 -timeout 30m -v
          go test ./internal/session -run '^TestRecoveryHTTPHandlerDoesNotReturnWhileOwnedSenderCanWrite$' -count=100 -v
          go test -race ./internal/session -run '^TestRecoveryHTTPHandlerDoesNotReturnWhileOwnedSenderCanWrite$' -count=20 -v
      - name: Step 4 multi-peer mesh evidence
        run: |
          go test ./tests/integration -run 'TestNoiseListenerAcceptsAndSeparatesTwoIRPeers|TestIRToIRNoiseMeshRoundTrip' -count=1 -v
          go test ./internal/failover -run '^TestProxyFallsBackToSecondary$' -count=1 -v
          go test ./internal/bcc -run '^TestFinancialTrafficSync$' -count=1 -v
      - name: Step 5.1 telemetry evidence
        run: |
          go test ./internal/telemetry -run '^TestExporterQueuesRetriesAndPreservesSequence$' -count=1 -v
          go test ./internal/bcc -run '^TestFinancialTrafficSync$' -count=1 -v
          go test ./tests/integration -run '^TestRuntimeTelemetryReachesBCCExactlyOnce$' -count=1 -v
      - name: Step 5.2 monitoring evidence
        run: |
          go test ./internal/bcc -run '^TestMonitoringAlertsAndSevenDayHistory$' -count=1 -v
          go test ./tests/integration -run '^TestRouteDisconnectTurnsMonitoringDownWithin30Seconds$' -count=1 -v
      - name: Step 5.3 finance and monitoring completion evidence
        run: |
          go test ./internal/bcc -run 'TestForcedStaleAlertFiresOnceAndResolvesOnce|TestWebhookSecretNeverAppearsInAPIResponses|TestNodeRegistrationUsesEnvTokenAndRejectsRawSecret|TestFinanceRateChangeMidDayUsesEffectiveVersion|TestFinanceDailyMonthlyAndClusterSumsMatch|TestFinanceTehranDayBoundary|TestFinanceDuplicateAndOutOfOrderDoNotChangeReports|TestFinanceReportAPIAndCSV' -count=1 -v
          go test ./tests/integration -run '^TestBadNoiseHandshakeIncrementsTelemetryAndReachesBCC$' -count=1 -v
      - name: Step 5.4 BCC hardening evidence
        run: |
          go test ./internal/bcc -run 'TestAuditLogAdminTransactionsAndTamperDetection|TestRateLimitAndBruteForceTemporaryBlock|TestAgentTokenRotationGraceAndImmediateRevoke|TestValidateListenAddressWhitelist' -count=1 -v
      - name: Step 5.5 backup restore and anchor evidence
        run: |
          go test ./internal/bcc -run 'TestAuditAnchorsDetectFullyRewrittenChainAndFireOnSecurityChanges|TestTrustedProxyXForwardedForAcceptedOnlyFromConfiguredProxy|TestEncryptedBackupFreshRestoreFullStateAndAudit|TestBackupRejectsWrongKeyTamperAndSchemaWithoutChangingState|TestRestorePreservesPostBackupRotationAndRevoke|TestRestorePreservesTelemetryHighWatermarkAndFinanceIdempotency|TestBackupSnapshotRemainsInternallyConsistentDuringTelemetry|TestScheduledBackupRetentionDefaultsSevenDailyFourWeekly|TestBackupKeyComesOnlyFromEnvironment|TestTelemetryBootIDAntiRollbackEqualTimestampUsesIngestID|TestTelemetryBootIDAntiRollbackClockSkewUsesIngestID|TestRestoreFaultInjectionLeavesStateAndAuditUnchanged|TestRestoreRejectsCorruptCurrentAuditBeforeMutation|TestDurableRevokeAnchorRetryAfterRestart|TestDurableRotationAnchorRetryAfterRestart|TestMultiplePendingAuditAnchorsPreserveOrderAndNoLoss|TestAuditAnchorACKRemovesPendingAndProvidesIdempotencyKey' -count=1 -v
      - name: Step 5.6 persistent telemetry reliability evidence
        run: |
          go test ./internal/telemetry -run 'TestPersistentQueueSurvivesRestartAndDeliversInOrder|TestMultipleRestartsDuringOutagePreserveOrder|TestCorruptedSpoolFailsClosed|TestSpoolCapacityNoSilentEviction|TestPendingReportsUseCurrentTokenAfterRotationAndSpoolHasNoSecret|TestConcurrentSampleFlushAndSpoolOpen|TestExporterObservabilityShowsCapacityAndRecovery' -count=1 -v
          go test ./internal/bcc -run 'TestCrashAfterServerCommitBeforeLocalACKExactlyOnceFinance|TestRetiredBootIDReplayRejectedAcrossBCCRestart|TestRetiredBootIDSurvivesOldBackupRestore' -count=1 -v
          go test ./tests/integration -run '^TestRuntimePersistentTelemetrySurvivesOutageAndRestart$' -count=1 -v
      - name: Step 5.7 ECRL runtime integration evidence
        run: |
          go test ./internal/config -run '^TestValidateSameProcessRecoveryScope$' -count=1 -v
          go test ./internal/node -run 'TestRuntimeCandidateSetupFailureKeepsOldOwner|TestRuntimeSnapshotExchangeFailureKeepsOldOwner|TestRuntimeFailureImmediatelyBeforeCommitKeepsOldOwner' -count=1 -v
          go test ./internal/session -run 'TestOldEpochFramesRejectedAfterCommit|TestRecoveryFailureBeforeCommitKeepsOldOwner|TestRecoveryFailureImmediatelyBeforeCommitKeepsOldOwner|TestRecoveryPeerBootChangeFailsClosed|TestCompetingRecoveryCandidatesSingleWinner|TestRecoveryDuringFINPreservesCloseSemantics|TestRecoveryDuringFINPreservesPendingFinAck|TestMultiFlowCarrierReplacementNoDuplicateOrLoss|TestRuntimeRecoveryRouteIdentityIsolation|TestRecoveryBoundedReplayMissingBytesFailsClosed|TestRecoveryFreezeRejectsNewOpenOnLiveSession|TestRecoveryDisabledBaselineUnchanged|TestDuplicateCommitIsIdempotent|TestLostCommitACKRetryIsIdempotent|TestPlanDigestMismatchRejectsCommit|TestPostCommitReplayFailureNeverReauthorizesOldEpoch|TestPostCommitFailureCanRecoverToNextEpoch|TestPostCommitFailureDoesNotLeaveSessionFrozen|TestRecoveryCommitMetricsReflectAuthorityChange' -count=1 -v
          go test ./tests/integration -run 'TestTwoRuntimeDialerPreCommitFailureKeepsBothOldEpoch|TestTwoRuntimeListenerPreCommitFailureKeepsBothOldEpoch' -count=1 -v
          go test ./tests/integration -run '^(TestRuntimeCarrierReplacementPreservesActiveFlow|TestRuntimeCarrierReplacementAcrossTransportFallbacks)$' -count=3 -v
          go test ./tests/integration -run 'TestMultiFlowCarrierReplacementNoDuplicateOrLoss|TestRuntimeRecoveryRouteIdentityIsolation|TestRecoveryTelemetryFinanceRemainExact' -count=1 -v
      - name: Step 5.7 P0 distributed commit uncertainty evidence
        run: |
          go test ./internal/session -run 'TestCommitUncertainCannotAbortWithoutProof|TestCommittedResolutionCatchesUpExactTransaction|TestNotCommittedResolutionAllowsAbort|TestConflictingResolutionFailsClosed|TestUncertainBlocksFreshRecovery|TestDuplicateResolutionIsIdempotent|TestFinalizeRetryIsIdempotent|TestDuplicateCommitIsIdempotent|TestLostCommitACKRetryIsIdempotent|TestPlanDigestMismatchRejectsCommit|TestPostCommitReplayFailureNeverReauthorizesOldEpoch|TestPostCommitFailureCanRecoverToNextEpoch|TestPostCommitFailureDoesNotLeaveSessionFrozen|TestRecoveryCommitMetricsReflectAuthorityChange|TestReplacementWaitRequiresApplicationReadyFrontier|TestInitialFinalizePublishesActivatedGeneration|TestReplacementReadyGenerationMonotonicAcrossRebind|TestStaleReplacementGenerationCannotRegressOrWakeNewerState|TestWakeWithoutReadinessAdvanceDoesNotReleaseReplacement|TestRecoveryRestoresAuthenticatedPeerCreditFrontier|TestRecoveryPeerCreditNeverRegressesPastNewerOldCarrierWindow' -count=1 -v
          go test ./tests/integration -run 'TestDistributedCommitACKLossResolvesWithoutAuthorityDivergence|TestDistributedCommitDisconnectBeforePublishProvesAbortSafe|TestDistributedCommitFault|TestTwoRuntimeDialerPreCommitFailureKeepsBothOldEpoch|TestTwoRuntimeListenerPreCommitFailureKeepsBothOldEpoch|TestFinalACKLossAfterDialerPublishConvergesBothFinalized|TestUnprovenReplayCarrierFailureStaysExactTransaction|TestUnprovenReplayWithLiveDataRecutRemainsExact|TestStableRecoveryTransactionAllowsFreshLaterEpoch|TestReplayWriteSuccessWithoutPeerAcceptanceIsRetriedSafely|TestReplayPeerAcceptanceFrontierAdvancesMonotonically|TestFINWriteSuccessWithoutPeerAcceptanceRetriesIdempotently|TestFINACKWriteSuccessWithoutPeerAcceptanceRetriesIdempotently|TestPostFinalizationCarrierFailureUsesFreshRecoverySnapshot|TestStableFinalizedCarrierFailureStartsFreshEpoch|TestUnresolvedTransactionRebindKeepsSameEpochCandidateDigest|TestMultipleConsecutiveCarrierReplacementsKeepSameTCPFlow|TestOldFinalizeInvocationCannotAdoptReboundPreparedCarrier|TestStaleFinalizeTeardownCannotFenceNewIncarnation|TestStaleFinalizeFailureCannotRegressNewIncarnation' -count=1 -v
      - name: P0-R1 Class-A cancellation ownership stress
        run: |
          go test ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=500 -timeout 15m -v
          GOMAXPROCS=2 go test ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=500 -timeout 15m -v
          go test -race ./tests/integration -run '^TestUnprovenReplayCarrierFailureStaysExactTransaction$' -count=50 -timeout 15m -v
      - name: P0-R1 carrier-error lifecycle regressions
        run: |
          go test -race ./internal/session -run '^TestFinalizeRecoveryCommitRunTeardownInterleavings$' -count=100 -timeout 5m -v
          go test ./tests/integration -run '^TestClassASecondCutCannotCancelLogicalSession$' -count=10 -timeout 10m -v
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Protocol fuzz smoke
        run: go test ./internal/protocol -run '^$' -fuzz '^FuzzDecode$' -fuzztime 10s

  release-dry-run:
    # Rehearse a signed release with throwaway keys: reproducible build,
    # sign, verify, and rejection of tampered or untrusted releases.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Release dry run
        run: scripts/release/dry_run.sh

  third-party-licenses:
    # THIRD_PARTY_LICENSES.md must match the modules linked into the release
    # binaries, and none of them may carry a strong-copyleft license.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Check third-party licenses
        run: scripts/third_party_licenses.sh --check

  e2e-binaries:
    # Real `baft` and `baft-pair` binaries: pair an EX and IR the way
    # install.sh does, run both, and push data through a local echo target.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build
        run: go build -o "$RUNNER_TEMP/bin/" ./cmd/baft ./cmd/baft-pair
      - name: Pair and pass traffic
        run: BIN_DIR="$RUNNER_TEMP/bin" tests/e2e/pair_and_run.sh
      - name: Pair and pass traffic (record shaping)
        run: BIN_DIR="$RUNNER_TEMP/bin" E2E_RECORD_SHAPING=1 tests/e2e/pair_and_run.sh
      - name: WebSocket carrier (transport=ws, Cloudflare path)
        run: tests/e2e/ws_carrier.sh
      - name: WebSocket carrier with uTLS fingerprint (ECDSA cert)
        run: BAFT_WS_UTLS=1 tests/e2e/ws_carrier.sh
      - name: Pair and pass traffic under CPU load
        run: |
          for i in $(seq "$(nproc)"); do (while :; do :; done) & done
          BIN_DIR="$RUNNER_TEMP/bin" tests/e2e/pair_and_run.sh
          kill $(jobs -p)

  e2e-install:
    # install.sh on a fresh Ubuntu runner with systemd: EX and IR on one host
    # under separate service names, paired through the installer itself.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Let root clone this checkout with a blob filter
        run: |
          git config uploadpack.allowFilter true
          sudo git config --system --add safe.directory '*'
      - name: Install EX and IR, pair, pass traffic
        # The test suite runs in the test job; here the installer only builds.
        # sudo drops GITHUB_ACTIONS, which the script needs for annotations.
        run: |
          sudo env GITHUB_ACTIONS=true BAFT_RUN_TESTS=0 BAFT_INSTALL_FROM=source \
            BAFT_REPO_URL="file://$GITHUB_WORKSPACE" BAFT_REF="$GITHUB_SHA" tests/e2e/install_two_roles.sh

  e2e-install-ssh:
    # The EX installer installs and pairs the IR over SSH (a real sshd on the
    # same runner stands in for the IR server): one command, nobody on the IR.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Let root clone this checkout with a blob filter
        run: |
          git config uploadpack.allowFilter true
          sudo git config --system --add safe.directory '*'
      - name: Install EX, which installs the IR over SSH, pair, pass traffic
        run: |
          sudo env GITHUB_ACTIONS=true BAFT_RUN_TESTS=0 BAFT_INSTALL_FROM=source BAFT_E2E_IR_VIA_SSH=1 \
            BAFT_REPO_URL="file://$GITHUB_WORKSPACE" BAFT_REF="$GITHUB_SHA" tests/e2e/install_two_roles.sh

  e2e-agent-enroll:
    # Server enrollment as SSH bootstrap will do it: install.sh --agent-only
    # from a signed release, then a real BCC deploy job the systemd agent runs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build a signed release with throwaway keys
        run: scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.1-ci
      - name: Enroll this host and run a signed job
        run: sudo env GITHUB_ACTIONS=true PATH="$PATH" tests/e2e/agent_enroll.sh "$RUNNER_TEMP/rel"

  e2e-ssh-bootstrap:
    # SSH bootstrap against a real sshd: host-key pinning, a wrong fingerprint
    # refused before anything runs, install.sh --agent-only over SSH, and the
    # enrolled agent running a signed job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build a signed release with throwaway keys
        run: scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.3-ci
      - name: Bootstrap this host over SSH
        run: sudo env GITHUB_ACTIONS=true PATH="$PATH" tests/e2e/ssh_bootstrap.sh "$RUNNER_TEMP/rel"

  e2e-launch1:
    # Launch-1 end to end on this exact commit: signed release, BCC, two
    # servers enrolled with install.sh --agent-only, a tunnel built by BCC with
    # real traffic through it, and a failing change rolled back on both sides.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build a signed release of this commit with throwaway keys
        run: scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.2-ci
      - name: Build, break and roll back a tunnel
        run: sudo env GITHUB_ACTIONS=true PATH="$PATH" tests/e2e/launch1.sh "$RUNNER_TEMP/rel"

  e2e-install-offline:
    # The offline bundle: pack a signed release with throwaway keys, refuse a
    # tampered copy, then install EX and IR from the unpacked bundle with every
    # download address pointed at a dead port, so any network use fails.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build a signed release and its offline bundle
        run: |
          set -euo pipefail
          scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.1-ci
          scripts/release/offline_bundle.sh "$RUNNER_TEMP/rel/dist" "$RUNNER_TEMP/rel/revocations.json" install.sh "$RUNNER_TEMP/bundle" .
          scripts/release/offline_bundle.sh "$RUNNER_TEMP/rel/dist" "$RUNNER_TEMP/rel/revocations.json" install.sh "$RUNNER_TEMP/bundle2" . >/dev/null
          cmp "$RUNNER_TEMP"/bundle/*.tar.gz "$RUNNER_TEMP"/bundle2/*.tar.gz
          (cd "$RUNNER_TEMP/bundle" && sha256sum -c ./*.sha256)
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/bundle/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          for f in LICENSE COPYRIGHT THIRD_PARTY_LICENSES.md; do test -s "$RUNNER_TEMP"/unpacked/baft-offline-*/"$f"; done
      - name: A tampered bundle is refused
        run: |
          set -euo pipefail
          d=$(echo "$RUNNER_TEMP"/unpacked/baft-offline-*)
          cp -r "$d" "$RUNNER_TEMP/tampered"
          printf 'x' >> "$RUNNER_TEMP/tampered/release/baft-linux-amd64"
          if BAFT_ROOT_PUB="$(cat "$RUNNER_TEMP/rel/root.pub")" BAFT_REVOCATIONS_FILE="$RUNNER_TEMP/tampered/revocations.json" \
               BAFT_VERIFY_ARTIFACTS="baft-linux-amd64" bash install.sh --verify-release "$RUNNER_TEMP/tampered/release"; then
            echo "::error::a tampered offline bundle was accepted"; exit 1
          fi
          BAFT_ROOT_PUB="$(cat "$RUNNER_TEMP/rel/root.pub")" BAFT_REVOCATIONS_FILE="$d/revocations.json" \
            BAFT_VERIFY_ARTIFACTS="baft-linux-amd64" bash install.sh --verify-release "$d/release"
      - name: Install EX and IR offline, pair, pass traffic
        run: |
          d=$(echo "$RUNNER_TEMP"/unpacked/baft-offline-*)
          sudo env GITHUB_ACTIONS=true BAFT_INSTALL_FROM=release BAFT_OFFLINE_DIR="$d" \
            BAFT_RELEASE_URL="http://127.0.0.1:9" BAFT_REVOCATIONS_URL="http://127.0.0.1:9/revocations.json" \
            BAFT_ROOT_PUB="$(cat "$RUNNER_TEMP/rel/root.pub")" \
            tests/e2e/install_two_roles.sh

  e2e-uninstall:
    # Safe uninstall acceptance on a systemd runner: EX + IR from a signed
    # release, a labelled BCC, an enrolled agent and units the operator wrote.
    # Conflict blocks, active tunnels need consent, interrupted runs restore
    # and resume, keep-data uninstall + reinstall without re-pairing, upgrade
    # then reinstall keeps anti-rollback, BCC state goes only after a verified
    # emergency backup, full uninstall removes only confirmed data, verify
    # clean, fresh reinstall; the operator's units survive throughout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build two signed releases with one throwaway root
        run: |
          export BAFT_LOCAL_RELEASE_ROOT="$RUNNER_TEMP/root"
          scripts/release/local_release.sh "$RUNNER_TEMP/rel1" v0.0.1-ci
          scripts/release/local_release.sh "$RUNNER_TEMP/rel2" v0.0.2-ci
      - name: Uninstall acceptance
        run: sudo env GITHUB_ACTIONS=true tests/e2e/uninstall.sh "$RUNNER_TEMP/rel1" "$RUNNER_TEMP/rel2"
      - name: Report uninstall evidence
        if: always()
        run: |
          d=/tmp/uninstall-e2e-report
          [ -d "$d" ] || { echo "::warning title=uninstall evidence::no report directory"; exit 0; }
          for f in zz-fail.log clean.txt resume.out crash2.out prov.log diag; do
            [ -f "$d/$f" ] || continue
            m="$(tail -c 3000 "$d/$f")"; m="${m//'%'/'%25'}"; m="${m//$'\r'/}"; m="${m//$'\n'/'%0A'}"
            echo "::notice title=uninstall evidence: $f::$m"
          done

  installer-faults:
    # install.sh on a fake tree (stateful systemctl stub, recording apt-get):
    # nothing on the host changes before the plan is confirmed, and an injected
    # failure restores files AND service state (active/enabled) for the role
    # and agent installs, fresh and existing, active and inactive.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Let root read this checkout
        run: sudo git config --system --add safe.directory '*'
      - name: Failure-injection and pre-confirmation checks
        run: sudo env "PATH=$PATH" "HOME=$HOME" tests/e2e/installer_faults.sh

  e2e-install-release:
    # The production path: install.sh downloads a signed release (built here
    # with throwaway keys), verifies it, and installs without Go or git.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build a signed release with throwaway keys
        run: BAFT_LOCAL_RELEASE_ROOT="$RUNNER_TEMP/root" scripts/release/local_release.sh "$RUNNER_TEMP/rel" v0.0.1-ci
      - name: Build the second release and two broken ones (same root key) for the upgrade and rollback checks
        run: |
          export BAFT_LOCAL_RELEASE_ROOT="$RUNNER_TEMP/root"
          scripts/release/local_release.sh "$RUNNER_TEMP/up/rel2" v0.0.2-ci
          BAFT_LOCAL_RELEASE_BREAK=version scripts/release/local_release.sh "$RUNNER_TEMP/up/brokenv" v0.0.3-ci
          BAFT_LOCAL_RELEASE_BREAK=run scripts/release/local_release.sh "$RUNNER_TEMP/up/brokenr" v0.0.3-ci
      - name: Install EX and IR from the release, pair, pass traffic, rerun x5, upgrade, roll back
        run: |
          sudo env GITHUB_ACTIONS=true BAFT_INSTALL_FROM=release \
            BAFT_RELEASE_URL="file://$RUNNER_TEMP/rel/dist" \
            BAFT_ROOT_PUB="$(cat "$RUNNER_TEMP/rel/root.pub")" \
            BAFT_REVOCATIONS_URL="file://$RUNNER_TEMP/rel/revocations.json" \
            BAFT_E2E_UPGRADE_DIR="$RUNNER_TEMP/up" \
            tests/e2e/install_two_roles.sh
