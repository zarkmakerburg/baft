name: stagec-soak

on:
  push:
    branches: [main, release-v1-goldapp]
    paths:
      - 'internal/session/**'
      - 'internal/node/**'
      - 'internal/resources/**'
      - 'internal/scheduler/**'
      - 'internal/carrier/**'
      - 'tests/integration/**'
      - '.github/workflows/stagec-soak.yml'
      - '.github/workflows/step57-recovery-soak.yml'
      - '.github/workflows/ci.yml'
      - 'STATUS.md'
      - 'TEST-RESULTS.md'
      - 'KNOWN-LIMITATIONS.md'
  workflow_dispatch:

concurrency:
  group: stagec-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Repeated real-path Stage C soak
        run: |
          go test ./tests/integration \
            -run '^(TestConcurrentMultiFlowTransfer|TestSlowReceiverCreatesBackpressureWithoutGrowingBAFTMemory)$' \
            -count=25 -timeout 15m -v
      - name: Race soak sample
        run: |
          go test -race ./tests/integration \
            -run '^(TestConcurrentMultiFlowTransfer|TestSlowReceiverCreatesBackpressureWithoutGrowingBAFTMemory)$' \
            -count=5 -timeout 15m -v
