name: stagec-soak

on:
  push:
    branches: [main]
    paths:
      - 'internal/session/**'
      - 'internal/resources/**'
      - 'internal/scheduler/**'
      - 'internal/carrier/**'
      - 'tests/integration/**'
      - '.github/workflows/stagec-soak.yml'
  workflow_dispatch:

concurrency:
  group: stagec-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Repeated real-path Stage C soak
        run: |
          go test ./tests/integration \
            -run '^(TestConcurrentMultiFlowTransfer|TestSlowReceiverCreatesBackpressureWithoutGrowingBAFTMemory)$' \
            -count=25 -timeout 15m -v
      - name: Race soak sample
        run: |
          go test -race ./tests/integration \
            -run '^(TestConcurrentMultiFlowTransfer|TestSlowReceiverCreatesBackpressureWithoutGrowingBAFTMemory)$' \
            -count=5 -timeout 15m -v
