name: stage-e-d008-first-assignment

on:
  workflow_dispatch:
  push:
    branches:
      - bench/stage-e-foundation
    paths:
      - '.github/workflows/stage-e-d008.yml'

permissions:
  contents: read

concurrency:
  group: stage-e-d008-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Record provenance
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/stage-e-d008"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "hostname=$(hostname)"
            echo "go=$(go version)"
            echo "uname=$(uname -a)"
            echo "--- lscpu ---"
            lscpu
            echo "--- tc ---"
            tc -V
          } | tee "$RUNNER_TEMP/stage-e-d008/provenance.txt"

      - name: Verify module lock and benchmark tests
        run: |
          set -euxo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./cmd/baft-bench -count=1
          go test ./tests/integration -run '^TestStageEMeasure(MultiFlowThroughput|DirectTCPThroughput|Recovery)$' -count=1 -timeout 10m

      - name: Current loopback baseline B06 and B08
        run: |
          set -euxo pipefail
          echo "COMMAND: go test ./tests/integration -run '^TestStageEMeasureMultiFlowThroughput$' -count=5 -timeout 10m -v"
          go test ./tests/integration             -run '^TestStageEMeasureMultiFlowThroughput$'             -count=5 -timeout 10m -v             2>&1 | tee "$RUNNER_TEMP/stage-e-d008/b06-baseline.log"

          echo "COMMAND: go test ./tests/integration -run '^TestStageEMeasureDirectTCPThroughput$' -count=5 -timeout 10m -v"
          go test ./tests/integration             -run '^TestStageEMeasureDirectTCPThroughput$'             -count=5 -timeout 10m -v             2>&1 | tee "$RUNNER_TEMP/stage-e-d008/b08-baseline.log"

      - name: B07 larger flow population
        run: |
          set -euxo pipefail
          echo "COMMAND: BAFT_STAGE_E_RECOVERY_FLOWS=128 go test ./tests/integration -run '^TestStageEMeasureRecovery$' -count=10 -timeout 20m -v"
          BAFT_STAGE_E_RECOVERY_FLOWS=128             go test ./tests/integration               -run '^TestStageEMeasureRecovery$'               -count=10 -timeout 20m -v               2>&1 | tee "$RUNNER_TEMP/stage-e-d008/b07-128flows.log"

      - name: Profile B06 cost centres
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/stage-e-d008/profile"
          echo "COMMAND: go test ./tests/integration -run '^TestStageEMeasureMultiFlowThroughput$' -count=1 -timeout 10m -v -cpuprofile=cpu.pprof -memprofile=heap.pprof -blockprofile=block.pprof -mutexprofile=mutex.pprof"
          go test ./tests/integration             -run '^TestStageEMeasureMultiFlowThroughput$'             -count=1 -timeout 10m -v             -cpuprofile="$RUNNER_TEMP/stage-e-d008/profile/cpu.pprof"             -memprofile="$RUNNER_TEMP/stage-e-d008/profile/heap.pprof"             -blockprofile="$RUNNER_TEMP/stage-e-d008/profile/block.pprof"             -mutexprofile="$RUNNER_TEMP/stage-e-d008/profile/mutex.pprof"             2>&1 | tee "$RUNNER_TEMP/stage-e-d008/profile/test.log"
          for p in cpu heap block mutex; do
            go tool pprof -top -nodecount=50 "$RUNNER_TEMP/stage-e-d008/profile/$p.pprof"               | tee "$RUNNER_TEMP/stage-e-d008/profile/$p-top.txt"
          done

      - name: Netem matrix BAFT versus direct TCP
        run: |
          set -euxo pipefail
          sudo -n tc qdisc show dev lo
          status=0
          for rtt in 50 150 300; do
            for loss in 0 1 3; do
              echo "=== NETEM RTT=${rtt}ms LOSS=${loss}% BAFT ==="
              echo "COMMAND: BAFT_STAGE_E_NETEM_RTT_MS=${rtt} BAFT_STAGE_E_NETEM_LOSS_PCT=${loss} go test ./tests/integration -run '^TestStageEMeasureMultiFlowThroughput$' -count=3 -timeout 20m -v"
              if ! BAFT_STAGE_E_NETEM_RTT_MS="$rtt" BAFT_STAGE_E_NETEM_LOSS_PCT="$loss"                 go test ./tests/integration                   -run '^TestStageEMeasureMultiFlowThroughput$'                   -count=3 -timeout 20m -v                   2>&1 | tee "$RUNNER_TEMP/stage-e-d008/netem-baft-rtt${rtt}-loss${loss}.log"; then
                status=1
              fi

              echo "=== NETEM RTT=${rtt}ms LOSS=${loss}% DIRECT ==="
              echo "COMMAND: BAFT_STAGE_E_NETEM_RTT_MS=${rtt} BAFT_STAGE_E_NETEM_LOSS_PCT=${loss} go test ./tests/integration -run '^TestStageEMeasureDirectTCPThroughput$' -count=3 -timeout 20m -v"
              if ! BAFT_STAGE_E_NETEM_RTT_MS="$rtt" BAFT_STAGE_E_NETEM_LOSS_PCT="$loss"                 go test ./tests/integration                   -run '^TestStageEMeasureDirectTCPThroughput$'                   -count=3 -timeout 20m -v                   2>&1 | tee "$RUNNER_TEMP/stage-e-d008/netem-direct-rtt${rtt}-loss${loss}.log"; then
                status=1
              fi
            done
          done
          sudo -n tc qdisc del dev lo root || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-e-d008-${{ github.sha }}
          path: ${{ runner.temp }}/stage-e-d008
          if-no-files-found: error
          retention-days: 30
