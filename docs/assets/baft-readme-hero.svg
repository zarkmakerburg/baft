<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="720" viewBox="0 0 1536 720" role="img" aria-labelledby="title desc">
  <title id="title">BAFT README Hero</title>
  <desc id="desc">Dark gold BAFT resilient network fabric hero banner.</desc>
  <defs>
    <radialGradient id="goldGlow" cx="72%" cy="44%" r="45%">
      <stop offset="0%" stop-color="#f3bd45" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#f3bd45" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3bd45" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffe18a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f3bd45" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1536" height="720" fill="#050505"/>
  <rect width="1536" height="720" fill="url(#goldGlow)"/>
  <g opacity="0.34" fill="none" stroke="#f3bd45" stroke-width="1.2">
    <ellipse cx="1115" cy="350" rx="430" ry="165" transform="rotate(-14 1115 350)"/>
    <ellipse cx="1115" cy="350" rx="330" ry="122" transform="rotate(18 1115 350)"/>
    <ellipse cx="1115" cy="350" rx="230" ry="86" transform="rotate(-31 1115 350)"/>
    <ellipse cx="1115" cy="350" rx="510" ry="205" transform="rotate(8 1115 350)"/>
  </g>
  <g opacity="0.86" filter="url(#glow)">
    <path d="M650 250 C835 210, 1000 215, 1370 90" stroke="url(#goldLine)" stroke-width="3" fill="none"/>
    <path d="M650 392 C870 360, 1060 420, 1490 300" stroke="url(#goldLine)" stroke-width="3" fill="none"/>
    <path d="M690 510 C900 470, 1055 515, 1400 610" stroke="url(#goldLine)" stroke-width="2" fill="none" opacity="0.72"/>
    <circle cx="1100" cy="250" r="10" fill="#f3bd45"/>
    <circle cx="885" cy="402" r="10" fill="#f3bd45"/>
    <circle cx="1285" cy="438" r="10" fill="#f3bd45"/>
    <circle cx="1368" cy="90" r="13" fill="#f3bd45"/>
  </g>
  <g font-family="Vazirmatn, Tahoma, Arial, sans-serif" direction="rtl" unicode-bidi="bidi-override" text-anchor="end">
    <text x="620" y="208" fill="#f3bd45" font-size="28" font-weight="800" letter-spacing="2">BAFT · RESILIENT NETWORK FABRIC</text>
    <text x="620" y="310" fill="#f3bd45" font-size="76" font-weight="900">بافت؛</text>
    <text x="445" y="310" fill="#fffdf7" font-size="76" font-weight="900">زیرساخت تاب‌آور</text>
    <text x="620" y="405" fill="#fffdf7" font-size="76" font-weight="900">برای مسیرهای چندگانه</text>
    <text x="620" y="485" fill="#e8dfcf" font-size="31" font-weight="500">تونل‌سازی هوشمند، بازیابی پایدار ECRL و کنترل متمرکز مسیرها</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f3efe6">
    <text x="120" y="630">ECRL Runtime</text>
    <text x="390" y="630">N-Node Failover</text>
    <text x="700" y="630">RTL Safe</text>
    <text x="940" y="630">Logo Preserved</text>
    <text x="1245" y="630">PR #41</text>
  </g>
  <g stroke="#f3bd45" stroke-width="1" opacity="0.42">
    <line x1="320" y1="600" x2="320" y2="646"/>
    <line x1="635" y1="600" x2="635" y2="646"/>
    <line x1="885" y1="600" x2="885" y2="646"/>
    <line x1="1185" y1="600" x2="1185" y2="646"/>
  </g>
