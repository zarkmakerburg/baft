      <text x="512" y="90" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="900" font-family="Inter,Segoe UI,Arial,sans-serif">EX</text>
      <path d="M108 82C224 12 346 12 458 82" fill="none" stroke="#312715" stroke-width="16" stroke-linecap="round"/>
      <path d="M108 82C224 12 346 12 458 82" fill="none" stroke="url(#softGold)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M108 82C232 154 340 154 458 82" fill="none" stroke="#191919" stroke-width="16" stroke-linecap="round"/>
      <path d="M108 82C232 154 340 154 458 82" fill="none" stroke="#f3bd45" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
      <circle cx="282" cy="32" r="12" fill="#f3bd45" filter="url(#glow)"/>
      <text x="282" y="166" text-anchor="middle" fill="#c7bdab" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">authenticated carrier · recovery-aware route</text>
    </g>
