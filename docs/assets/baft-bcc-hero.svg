  <circle cx="1392" cy="160" r="42" fill="url(#flare)"/>
  <circle cx="1392" cy="160" r="5" fill="#ffe18a"/>
  <circle cx="1150" cy="452" r="56" fill="url(#flare)"/>
  <circle cx="1150" cy="452" r="7" fill="#ffe18a"/>
  <circle cx="1334" cy="548" r="48" fill="url(#flare)"/>
  <circle cx="1334" cy="548" r="6" fill="#ffe18a"/>
</g>

<g transform="translate(88 82)">
  <rect x="0" y="0" width="160" height="42" rx="21" fill="#0b0b0c" stroke="#5b4319"/>
  <circle cx="25" cy="21" r="6" fill="#92f0bf"/>
  <text x="50" y="27" fill="#fff8df" font-size="13" font-weight="700" letter-spacing="2" font-family="Inter,Segoe UI,Arial,sans-serif">BCC LIVE</text>

  <text x="0" y="112" fill="#ffffff" font-size="76" font-weight="900" font-family="Inter,Segoe UI,Arial,sans-serif">BAFT</text>
  <text x="0" y="166" fill="#f3bd45" font-size="38" font-weight="800" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext">مرکز فرماندهی بافت</text>
  <text x="0" y="218" fill="#f7f1e4" font-size="28" font-weight="800" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext">کنترل مسیرهای چندگانه، امضای عملیات، و failover آماده</text>
  <text x="0" y="258" fill="#c7bdab" font-size="17" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext">تم کلی BCC با صفحه اصلی هماهنگ شده: مشکی عمیق، طلایی گرم، کارت‌های متراکم و RTL تمیز.</text>

  <g transform="translate(0 322)">
    <rect width="170" height="56" rx="16" fill="url(#gold)"/>
    <text x="86" y="36" text-anchor="middle" fill="#070707" font-size="18" font-weight="900" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl">کنترل سریع</text>
    <g transform="translate(188 0)">
      <rect width="204" height="56" rx="16" fill="#0b0b0c" stroke="#625025"/>
      <text x="102" y="36" text-anchor="middle" fill="#fff6dd" font-size="17" font-weight="700" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl">مشاهده توپولوژی</text>
    </g>
  </g>

  <g transform="translate(0 458)">
    <g>
      <circle cx="20" cy="20" r="18" fill="#100d08" stroke="#f3bd45"/>
      <path d="M14 21h12M20 15v12" stroke="#f3bd45" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="26" fill="#eee6d5" font-size="15" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">N-Node Failover</text>
    </g>
    <g transform="translate(238 0)">
      <circle cx="20" cy="20" r="18" fill="#100d08" stroke="#f3bd45"/>
      <path d="M13 19l5 6 10-12" fill="none" stroke="#f3bd45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="26" fill="#eee6d5" font-size="15" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Signed Jobs</text>
    </g>
    <g transform="translate(430 0)">
      <circle cx="20" cy="20" r="18" fill="#100d08" stroke="#f3bd45"/>
      <path d="M20 11v18M12 17h16M12 23h16" stroke="#f3bd45" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="26" fill="#eee6d5" font-size="15" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Audit Chain</text>
    </g>
  </g>
</g>

<g transform="translate(760 120)" filter="url(#shadow)">
  <rect width="660" height="470" rx="28" fill="url(#panel)" stroke="#4b3918" stroke-width="1.5"/>
  <rect x="24" y="24" width="612" height="68" rx="18" fill="#050505" stroke="#2f2819"/>
