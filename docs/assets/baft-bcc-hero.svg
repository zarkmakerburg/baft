    <g transform="translate(316 0)">
      <rect width="132" height="76" rx="18" fill="#050505" stroke="#2f2819"/>
      <text x="18" y="29" fill="#a99b83" font-size="12" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">JOBS</text>
      <text x="18" y="56" fill="#ffffff" font-size="22" font-weight="900" font-family="Inter,Segoe UI,Arial,sans-serif">SIGNED</text>
