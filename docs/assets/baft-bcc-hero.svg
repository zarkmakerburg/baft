    <g transform="translate(468 0)">
      <rect width="116" height="76" rx="18" fill="#050505" stroke="#2f2819"/>
      <text x="18" y="29" fill="#a99b83" font-size="12" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">LOGO</text>
      <text x="18" y="56" fill="#f3bd45" font-size="20" font-weight="900" font-family="Inter,Segoe UI,Arial,sans-serif">SAFE</text>
