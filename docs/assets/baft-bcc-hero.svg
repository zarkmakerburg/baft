<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">BAFT — BCC visual identity</title>
<desc id="desc">BAFT project hero using the BAFT Command Center dark navy and gold visual system.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="0%" r="95%">
    <stop offset="0%" stop-color="#182238"/>
    <stop offset="48%" stop-color="#0d121d"/>
    <stop offset="100%" stop-color="#090b10"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#d99f32"/>
    <stop offset="50%" stop-color="#f0c66a"/>
    <stop offset="100%" stop-color="#e8b54a"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1400" height="460" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="458" rx="27" fill="none" stroke="#263147" stroke-width="2"/>

