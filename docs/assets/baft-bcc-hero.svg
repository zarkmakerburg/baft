<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="720" viewBox="0 0 1536 720" role="img" aria-labelledby="title desc">
<title id="title">BAFT Command Center visual system</title>
<desc id="desc">A black and gold RTL-safe BAFT Command Center hero showing live topology, failover readiness, signed jobs, and audit status. The official BAFT logo is preserved separately and is not redrawn in this visual.</desc>
<defs>
  <radialGradient id="bg" cx="74%" cy="18%" r="86%">
    <stop offset="0%" stop-color="#3a2a0f"/>
    <stop offset="38%" stop-color="#0c0b08"/>
    <stop offset="100%" stop-color="#030303"/>
  </radialGradient>
  <radialGradient id="flare" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffe18a" stop-opacity=".92"/>
    <stop offset="34%" stop-color="#f3bd45" stop-opacity=".38"/>
    <stop offset="100%" stop-color="#f3bd45" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8f5d11"/>
    <stop offset="26%" stop-color="#ffe18a"/>
    <stop offset="54%" stop-color="#f3bd45"/>
    <stop offset="100%" stop-color="#9b6418"/>
  </linearGradient>
  <linearGradient id="softGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f3bd45" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffe18a" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#f3bd45" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16120a"/>
    <stop offset="100%" stop-color="#090909"/>
  </linearGradient>
  <filter id="glow" x="-55%" y="-55%" width="210%" height="210%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-24%" width="140%" height="148%">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity=".56"/>
  </filter>
</defs>

<rect width="1536" height="720" rx="0" fill="#030303"/>
<rect width="1536" height="720" fill="url(#bg)"/>
<path d="M0 96H1536M0 188H1536M0 280H1536M0 372H1536M0 464H1536M0 556H1536M0 648H1536" stroke="#ffffff" stroke-opacity=".035"/>
<path d="M144 0V720M288 0V720M432 0V720M576 0V720M720 0V720M864 0V720M1008 0V720M1152 0V720M1296 0V720M1440 0V720" stroke="#ffffff" stroke-opacity=".03"/>

<g opacity=".72">
  <path d="M960 86C1132 96 1274 164 1422 296" fill="none" stroke="#f3bd45" stroke-opacity=".55" stroke-width="2"/>
  <path d="M856 548C1042 430 1210 364 1510 358" fill="none" stroke="#f3bd45" stroke-opacity=".42" stroke-width="2"/>
  <path d="M800 222C1012 256 1162 260 1392 160" fill="none" stroke="#ffe18a" stroke-opacity=".25" stroke-width="1.5"/>
  <path d="M928 618C1126 566 1300 528 1488 628" fill="none" stroke="#ffe18a" stroke-opacity=".2" stroke-width="1.5"/>
  <circle cx="948" cy="86" r="48" fill="url(#flare)"/>
  <circle cx="948" cy="86" r="6" fill="#ffe18a"/>
  <circle cx="1238" cy="186" r="54" fill="url(#flare)"/>
