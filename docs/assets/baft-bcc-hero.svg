<text x="78" y="233" fill="#e8b54a" font-size="22" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Bounded · Authenticated · Fail-safe · Transactional</text>
<text x="78" y="271" fill="#8e9aaf" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Signed Releases · Secure Agent · BCC Control Plane · Native Tunnel Builder</text>

